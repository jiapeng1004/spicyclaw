spring:
  datasource:
    url: jdbc:h2:mem:spicyclaw;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS spicyclaw
    username: sa
    password:
    driver-class-name: org.h2.Driver
  docker:
    compose:
      enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
  sql:
    init:
      mode: always

mybatis-plus:
  global-config:
    db-config:
      schema: spicyclaw

spicyclaw:
  skills-dir: ./target/test-skills-cache
  skills-store-dir: ./target/test-skills-store
  security:
    enabled: false

agentscope:
  agent:
    enabled: false
